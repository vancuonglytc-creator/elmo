<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu Thông Tin Đăng Ký Cuộc Thi ELMO 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Thư viện tạo mã QR trực tiếp trên canvas (nhẹ, nhanh, không phụ thuộc API ngoài) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <!-- Thư viện chụp màn hình & xuất PDF chuyên dụng -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* Định dạng bảng giấy báo thi chuẩn Word: Font Arial, chữ đen */
    .ticket-box {
      font-family: Arial, Helvetica, sans-serif;
      color: #000000;
      background-color: #ffffff;
      width: 760px;
      padding: 24px 28px;
      box-sizing: border-box;
      line-height: 1.35;
    }

    .ticket-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
    }

    .ticket-table td {
      border: 1px solid #000000;
      padding: 6px 10px;
      vertical-align: middle;
      font-size: 13px;
      color: #000000;
    }

    .ticket-table .label-col {
      width: 32%;
      font-weight: bold;
      background-color: #f8fafc;
    }

    .ticket-table .value-col {
      font-size: 13.5px;
      color: #000000;
    }

    /* Vùng kết xuất PDF: hiển thị ở tầng đáy ngoài màn hình để không che giao diện web */
    #renderPdfWrapper {
      position: fixed;
      left: 0;
      top: 0;
      z-index: -9999;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 text-slate-800">
  <div class="max-w-xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-blue-900 uppercase">TRA CỨU THÔNG TIN ĐĂNG KÝ DỰ THI ELMO 2026</h1>
      <p class="text-sm text-slate-500 mt-1">Lưu ý: Phụ huynh vui lòng kiểm tra kỹ thông tin, nếu sai bất kỳ thông tin nào phụ huynh vui lòng liên hệ Ban Tổ chức</p>
    </div>

    <!-- Search Box -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
      <form id="searchForm" class="space-y-3">
        <div>
          <label for="phone" class="block text-sm font-semibold text-slate-700 mb-1">
            Số điện thoại liên hệ đã đăng ký:
          </label>
          <input 
            type="tel" 
            id="phone" 
            placeholder="Ví dụ: 0912345678" 
            required 
            class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none mb-1"
          >
        </div>
        <button 
          type="submit" 
          id="btnSearch"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition duration-200"
        >
          Tra cứu kết quả
        </button>

        <!-- Nút Liên hệ Ban Tổ chức -->
        <a 
          href="https://zalo.me/khoahoctre" 
          target="_blank" 
          rel="noopener noreferrer"
          class="w-full inline-flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-xl transition duration-200 shadow-sm"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.0
