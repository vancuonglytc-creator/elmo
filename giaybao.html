<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu Thông Tin Đăng Ký Cuộc Thi ELMO 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Thư viện tạo mã QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Thư viện xuất HTML sang file PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    .pdf-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Times New Roman', Times, serif;
    }
    .pdf-table td {
      border: 1px solid #000;
      padding: 6px 10px;
      vertical-align: middle;
      font-size: 13.5px;
      line-height: 1.35;
    }
    .label-cell {
      background-color: #f1f5f9;
      font-weight: bold;
      width: 32%;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen py-10 px-4 text-slate-800">
  <div class="max-w-xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-blue-900 uppercase">TRA CỨU THÔNG TIN ĐĂNG KÝ DỰ THI ELMO 2026</h1>
      <p class="text-sm text-slate-500 mt-1">Lưu ý: Phụ huynh vui lòng kiểm tra kỹ thông tin, nếu sai bất kỳ thông tin nào phụ huynh vui lòng liên hệ Ban Tổ chức</p>
    </div>

    <!-- Search Box -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
      <form id="searchForm" class="space-y-3">
        <div>
          <label for="phone" class="block text-sm font-semibold text-slate-700 mb-1">
            Số điện thoại liên hệ đã đăng ký:
          </label>
          <input 
            type="tel" 
            id="phone" 
            placeholder="Ví dụ: 0912345678" 
            required 
            class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none mb-1"
          >
        </div>
        <button 
          type="submit" 
          id="btnSearch"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition duration-200"
        >
          Tra cứu kết quả
        </button>

        <!-- Nút Liên hệ Ban Tổ chức -->
        <a 
          href="https://zalo.me/khoahoctre" 
          target="_blank" 
          rel="noopener noreferrer"
          class="w-full inline-flex items-center justify-center gap-2 bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-xl transition duration-200 shadow-sm"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
          Liên hệ Ban Tổ chức (Zalo)
        </a>
      </form>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden text-center py-6 text-slate-500 font-medium">
      <svg class="animate-spin h-6 w-6 mx-auto mb-2 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      Đang tìm kiếm dữ liệu...
