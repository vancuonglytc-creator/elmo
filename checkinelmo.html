<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điểm Danh & Xếp Phòng - Toán ELMO 2026</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --primary: #0056b3;
      --purple: #6d28d9;
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --danger: #d90429;
      --success: #1b7a37;
      --warning: #d97706;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body {
      margin: 0; padding: 12px; background-color: var(--bg);
      display: flex; flex-direction: column; align-items: center;
    }
    .container {
      width: 100%; max-width: 580px; background: var(--card-bg);
      padding: 18px; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 12px;
    }
    h1 {
      color: var(--primary); font-size: 1.2rem; margin: 0; text-transform: uppercase;
    }
    .sync-badge {
      font-size: 0.78rem; padding: 4px 10px; border-radius: 20px; font-weight: 600;
      background: #e2e8f0; color: #475569;
    }
    .sync-ready { background: #dcfce7; color: #166534; }
    .sync-pending { background: #fef3c7; color: #92400e; }
    .sync-error { background: #fee2e2; color: #991b1b; }

    /* Bộ chọn chế độ: Check-in Cổng vs Xếp Phòng Thi */
    .mode-switcher {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #e2e8f0; padding: 5px; border-radius: 10px; margin-bottom: 12px;
    }
    .mode-btn {
      padding: 10px; border: none; border-radius: 7px; font-weight: 700;
      font-size: 0.92rem; cursor: pointer; background: transparent; color: #475569;
      transition: all 0.2s;
    }
    .mode-btn.active-gate {
      background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(0,86,179,0.3);
    }
    .mode-btn.active-room {
      background: var(--purple); color: #fff; box-shadow: 0 2px 6px rgba(109,40,217,0.3);
    }

    /* Khu vực nhập/chọn Phòng thi (Chỉ hiện khi ở chế độ Xếp Phòng) */
    #room-selector-box {
      display: none; background: #f5f3ff; border: 1.5px solid #c4b5fd;
      padding: 12px; border-radius: 10px; margin-bottom: 12px;
    }
    #room-selector-box label {
      display: block; font-size: 0.85rem; font-weight: 700; color: var(--purple);
      margin-bottom: 6px; text-transform: uppercase;
    }
    .room-input-row {
      display: flex; gap: 8px;
    }
    #room-input {
      flex: 1; padding: 10px 12px; font-size: 1.05rem; font-weight: 700;
      border: 1.5px solid #a78bfa; border-radius: 8px; color: #4c1d95; outline: none;
    }
    .room-counter {
      background: var(--purple); color: #fff; padding: 0 14px; border-radius: 8px;
      display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; white-space: nowrap;
    }

    .camera-wrapper {
      position: relative; width: 100%; margin-bottom: 12px;
    }
    #reader {
      width: 100%; min-height: 220px; border-radius: 10px; overflow: hidden;
      border: 2px solid #cbd5e1; background: #1e293b;
    }
    .camera-off-placeholder {
      display: none; height: 110px; background: #1e293b; color: #94a3b8;
      border-radius: 10px; align-items: center; justify-content: center;
      font-weight: 600; border: 2px dashed #475569;
    }
    .cam-controls {
      display: flex; justify-content: flex-end; margin-top: 8px;
    }
    .btn-cam {
      padding: 7px 14px; font-size: 0.88rem; font-weight: 600; border-radius: 6px;
      border: none; cursor: pointer; color: #fff; background: #475569;
    }
    .btn-cam.active { background: var(--danger); }
    .btn-cam.off { background: var(--success); }

    .manual-input {
      display: flex; gap: 8px; margin-bottom: 14px;
    }
    input[type="text"].sbd-field {
      flex: 1; padding: 12px 14px; font-size: 1.05rem; border: 1.5px solid #cbd5e1;
      border-radius: 8px; text-transform: uppercase; outline: none;
    }
    input[type="text"].sbd-field:focus { border-color: var(--primary); }
    .btn-submit {
      padding: 12px 18px; font-size: 1rem; font-weight: 700; color: #fff;
      background-color: var(--primary); border: none; border-radius: 8px; cursor: pointer;
    }

    #status-msg {
      text-align: center; font-weight: 700; margin-bottom: 14px; padding: 11px;
      border-radius: 8px; display: none; font-size: 0.96rem;
    }
    .msg-loading { background: #e0f2fe; color: #0369a1; display: block !important; }
    .msg-success { background: #dcfce7; color: var(--success); display: block !important; }
    .msg-room { background: #ede9fe; color: var(--purple); display: block !important; }
    .msg-warning { background: #fef3c7; color: var(--warning); display: block !important; }
    .msg-error { background: #fee2e2; color: var(--danger); display: block !important; }

    #result-card {
      display: none; border: 2.5px solid var(--success); border-radius: 12px;
      padding: 16px; background: #ffffff;
    }
    .sbd-box {
      background: #fff5f5; border: 1px dashed #feb2b2; padding: 8px 12px;
      border-radius: 8px; margin-bottom: 12px; text-align: center;
    }
    .sbd-highlight {
      color: #d90429; font-weight: 900; font-size: 1.85rem; letter-spacing: 1.5px; display: block;
    }
    .room-badge-card {
      display: inline-block; margin-top: 4px; padding: 3px 10px; border-radius: 6px;
      background: #ede9fe; color: var(--purple); font-weight: 800; font-size: 0.95rem;
    }
    .info-row {
      margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #f1f5f9;
      font-size: 1.02rem; line-height: 1.4;
    }
    .info-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .label { font-weight: 600; color: #64748b; display: block; font-size: 0.82rem; text-transform: uppercase; }
    .value { color: #0f172a; font-weight: 600; }
    .student-name { font-size: 1.22rem; font-weight: 800; color: #0056b3; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1>Điểm Danh ELMO 2026</h1>
    <span id="sync-status" class="sync-badge">Đang tải DS...</span>
  </div>

  <!-- Chuyển đổi chế độ -->
  <div class="mode-switcher">
    <button id="btn-mode-gate" class="mode-btn active-gate" onclick="setMode('gate')">1. Check-in Cổng</button>
    <button id="btn-mode-room" class="mode-btn" onclick="setMode('room')">2. Xếp Phòng Thi</button>
  </div>

  <!-- Ô nhập/chọn Phòng thi (hiện khi chọn chế độ 2) -->
  <div id="room-selector-box">
    <label for="room-input">Nhập / Chọn Phòng thi đang phụ trách:</label>
    <div class="room-input-row">
      <input type="text" id="room-input" list="room-suggestions" placeholder="VD: Phòng 101" oninput="onRoomChange()" />
      <datalist id="room-suggestions">
        <option value="Phòng 01">
        <option value="Phòng 02">
        <option value="Phòng 03">
        <option value="Phòng 04">
        <option value="Phòng 05">
        <option value="Phòng 06">
        <option value="Phòng 07">
        <option value="Phòng 08">
        <option value="Phòng 09">
        <option value="Phòng 10">
      </datalist>
      <div class="room-counter" id="room-count-badge">Đã vào: 0</div>
    </div>
  </div>

  <div class="camera-wrapper">
    <div id="reader"></div>
    <div id="cam-placeholder" class="camera-off-placeholder">📷 Camera đang tắt</div>
    <div class="cam-controls">
      <button id="btn-toggle-cam" class="btn-cam active" onclick="toggleCamera()">Tắt Camera</button>
    </div>
  </div>

  <div class="manual-input">
    <input type="text" id="sbd-input" class="sbd-field" placeholder="Nhập SBD (VD: S1550125)..." autocomplete="off" />
    <button class="btn-submit" id="btn-action" onclick="manualCheckin()">Điểm danh</button>
  </div>

  <div id="status-msg"></div>

  <div id="result-card">
    <div class="sbd-box">
      <span class="label">Số báo danh</span>
      <span id="res-sbd" class="sbd-highlight"></span>
      <span id="res-room-tag" class="room-badge-card" style="display:none;"></span>
    </div>
    <div class="info-row">
      <span class="label">Tên - Họ thí sinh</span>
      <span id="res-hoten" class="value student-name"></span>
    </div>
    <div class="info-row">
      <span class="label">Trường & Địa bàn (Phường/Xã/Đặc khu)</span>
      <span id="res-truong" class="value"></span>
    </div>
    <div class="info-row">
      <span class="label">Bảng thi</span>
      <span id="res-bang" class="value"></span>
    </div>
    <div class="info-row">
      <span class="label">Khu vực thi</span>
      <span id="res-khuvuc" class="value"></span>
    </div>
    <div class="info-row">
      <span class="label">Phụ huynh & Số điện thoại liên hệ</span>
      <span id="res-phuhuynh" class="value"></span>
    </div>
  </div>
</div>

<script>
  // DÁN LINK WEB APP GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY:
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypkQ23cOk3mjcAH1DNXy06yOw0rwXTEJhMKFlo5z3rYhUKbyo4cAvjuWuHwsb9jsiC/exec";

  let currentMode = "gate"; // "gate" | "room"
  let studentDB = {};
  let isDataLoaded = false;
  let syncQueue = [];
  let isSyncing = false;

  let html5QrCode = null;
  let isCameraRunning = false;
  let lastScannedCode = "";
  let lastScanTime = 0;

  // Chuyển đổi qua lại giữa Check-in Cổng và Xếp Phòng Thi
  function setMode(mode) {
    currentMode = mode;
    const btnGate = document.getElementById("btn-mode-gate");
    const btnRoom = document.getElementById("btn-mode-room");
    const roomBox = document.getElementById("room-selector-box");
    const btnAction = document.getElementById("btn-action");

    if (mode === "room") {
      btnGate.className = "mode-btn";
      btnRoom.className = "mode-btn active-room";
      roomBox.style.display = "block";
      btnAction.style.backgroundColor = "var(--purple)";
      btnAction.innerText = "Xếp phòng";
      updateRoomCounter();
    } else {
      btnGate.className = "mode-btn active-gate";
      btnRoom.className = "mode-btn";
      roomBox.style.display = "none";
      btnAction.style.backgroundColor = "var(--primary)";
      btnAction.innerText = "Điểm danh";
    }
    localStorage.setItem("ELMO_MODE", mode);
  }

  function onRoomChange() {
    const val = document.getElementById("room-input").value;
    localStorage.setItem("ELMO_ROOM_NAME", val);
    updateRoomCounter();
  }

  // Đếm tự động số thí sinh đã được xếp vào phòng đang chọn (giúp giám thị biết khi nào đủ sĩ số phòng)
  function updateRoomCounter() {
    const roomName = document.getElementById("room-input").value.trim().toLowerCase();
    const badge = document.getElementById("room-count-badge");
    if (!roomName || !isDataLoaded) {
      badge.innerText = "Đã vào: 0";
      return;
    }
    let count = 0;
    for (const sbd in studentDB) {
      if ((studentDB[sbd].rm || "").trim().toLowerCase() === roomName) {
        count++;
      }
    }
    badge.innerText = `Đã vào: ${count}`;
  }

  async function loadStudentDatabase() {
    const badge = document.getElementById("sync-status");
    try {
      const res = await fetch(SCRIPT_URL, { method: "GET", redirect: "follow" });
      const json = await res.json();
      if (json.status === "success") {
        studentDB = json.data;
        isDataLoaded = true;
        const count = Object.keys(studentDB).length;
        badge.innerText = `Sẵn sàng (${count} TS)`;
        badge.className = "sync-badge sync-ready";
        updateRoomCounter();
      } else {
        badge.innerText = "Lỗi tải DS";
        badge.className = "sync-badge sync-error";
      }
    } catch (e) {
      badge.innerText = "Chế độ trực tiếp";
      badge.className = "sync-badge sync-pending";
    }
  }

  async function startCamera() {
    if (isCameraRunning) return;
    if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
    const btn = document.getElementById("btn-toggle-cam");
    const readerEl = document.getElementById("reader");
    const placeholderEl = document.getElementById("cam-placeholder");

    try {
      readerEl.style.display = "block";
      placeholderEl.style.display = "none";
      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: 12, qrbox: { width: 230, height: 230 } },
        onScanSuccess
      );
      isCameraRunning = true;
      btn.innerText = "Tắt Camera";
      btn.className = "btn-cam active";
    } catch (err) {
      try {
        await html5QrCode.start(
          { facingMode: "user" },
          { fps: 12, qrbox: { width: 230, height: 230 } },
          onScanSuccess
        );
        isCameraRunning = true;
        btn.innerText = "Tắt Camera";
        btn.className = "btn-cam active";
      } catch (e2) {
        readerEl.style.display = "none";
        placeholderEl.style.display = "flex";
        placeholderEl.innerText = "📷 Không mở được Camera (Có thể nhập SBD bên dưới)";
        btn.innerText = "Bật Camera";
        btn.className = "btn-cam off";
      }
    }
  }

  async function stopCamera() {
    if (!isCameraRunning || !html5QrCode) return;
    try {
      await html5QrCode.stop();
      isCameraRunning = false;
      document.getElementById("reader").style.display = "none";
      document.getElementById("cam-placeholder").style.display = "flex";
      document.getElementById("cam-placeholder").innerText = "📷 Camera đang tắt";
      const btn = document.getElementById("btn-toggle-cam");
      btn.innerText = "Bật Camera";
      btn.className = "btn-cam off";
    } catch (e) {}
  }

  function toggleCamera() {
    if (isCameraRunning) stopCamera();
    else startCamera();
  }

  function playBeep(isSuccess = true) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = isSuccess ? "sine" : "sawtooth";
      osc.frequency.value = isSuccess ? 920 : 280;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + (isSuccess ? 0.12 : 0.25));
    } catch (e) {}
  }

  function getCurrentTimeFormatted() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()}`;
  }

  async function processCheckin(rawSbd) {
    const sbd = String(rawSbd || "").trim().toUpperCase();
    if (!sbd) return;

    const statusEl = document.getElementById("status-msg");
    const resultCard = document.getElementById("result-card");
    const roomName = document.getElementById("room-input").value.trim();

    if (currentMode === "room" && !roomName) {
      playBeep(false);
      alert("⚠️ Vui lòng nhập tên Phòng thi ở ô phía trên trước khi quét!");
      document.getElementById("room-input").focus();
      return;
    }

    if (isDataLoaded) {
      const st = studentDB[sbd];
      if (!st) {
        playBeep(false);
        resultCard.style.display = "none";
        statusEl.className = "msg-error";
        statusEl.innerText = "❌ Không tìm thấy Số báo danh: " + sbd;
        return;
      }

      playBeep(true);
      document.getElementById("sbd-input").value = "";

      if (currentMode === "room") {
        // CHẾ ĐỘ XẾP PHÒNG THI (Cột U)
        const prevRoom = st.rm;
        if (!st.c) {
          st.c = "Đã checkin";
          st.t = getCurrentTimeFormatted();
        }
        st.rm = roomName;
        renderStudentCard(st);
        updateRoomCounter();

        if (prevRoom && prevRoom.toLowerCase() !== roomName.toLowerCase()) {
          statusEl.className = "msg-warning";
          statusEl.innerText = `⚠️ ĐÃ CHUYỂN TỪ [${prevRoom}] SANG [${roomName}]`;
          resultCard.style.borderColor = "var(--warning)";
        } else {
          statusEl.className = "msg-room";
          statusEl.innerText = `🏫 ĐÃ XẾP VÀO: ${roomName.toUpperCase()}`;
          resultCard.style.borderColor = "var(--purple)";
        }

        enqueueSync(sbd, st.r, "room", roomName);
      } else {
        // CHẾ ĐỘ CHECK-IN CỔNG (Cột S & T)
        renderStudentCard(st);
        if (st.c === "Đã checkin") {
          statusEl.className = "msg-warning";
          statusEl.innerText = `⚠️ THÍ SINH ĐÃ ĐIỂM DANH LÚC ${st.t}`;
          resultCard.style.borderColor = "var(--warning)";
        } else {
          const nowStr = getCurrentTimeFormatted();
          st.c = "Đã checkin";
          st.t = nowStr;
          statusEl.className = "msg-success";
          statusEl.innerText = `✅ ĐIỂM DANH THÀNH CÔNG LÚC ${nowStr}`;
          resultCard.style.borderColor = "var(--success)";

          enqueueSync(sbd, st.r, "gate", "");
        }
      }
      return;
    }

    // Dự phòng nếu chưa tải xong RAM
    statusEl.className = "msg-loading";
    statusEl.innerText = "⏳ Đang xử lý SBD " + sbd + "...";
    resultCard.style.display = "none";

    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ sbd: sbd, row: 0, mode: currentMode, room: roomName })
      });
      const data = await res.json();

      if (data.status === "success" && data.student) {
        playBeep(true);
        studentDB[sbd] = data.student;
        renderStudentCard(data.student);
        document.getElementById("sbd-input").value = "";

        if (currentMode === "room") {
          statusEl.className = "msg-room";
          statusEl.innerText = `🏫 ĐÃ XẾP VÀO: ${roomName.toUpperCase()}`;
          resultCard.style.borderColor = "var(--purple)";
        } else if (data.alreadyCheckedIn) {
          statusEl.className = "msg-warning";
          statusEl.innerText = `⚠️ THÍ SINH ĐÃ ĐIỂM DANH LÚC ${data.checkinTime}`;
          resultCard.style.borderColor = "var(--warning)";
        } else {
          statusEl.className = "msg-success";
          statusEl.innerText = `✅ ĐIỂM DANH THÀNH CÔNG LÚC ${data.checkinTime}`;
          resultCard.style.borderColor = "var(--success)";
        }
      } else {
        playBeep(false);
        statusEl.className = "msg-error";
        statusEl.innerText = "❌ " + (data.message || "Không tìm thấy SBD");
      }
    } catch (err) {
      playBeep(false);
      statusEl.className = "msg-error";
      statusEl.innerText = "❌ Lỗi kết nối đến Google Sheets!";
    }
  }

  function renderStudentCard(st) {
    document.getElementById("res-sbd").innerText = st.s;
    document.getElementById("res-hoten").innerText = st.n;
    document.getElementById("res-truong").innerText = `${st.sc} — ${st.w}`;
    document.getElementById("res-bang").innerText = st.b;
    document.getElementById("res-khuvuc").innerText = st.k;
    document.getElementById("res-phuhuynh").innerText = `${st.pa} (SĐT: ${st.p})`;

    const roomTag = document.getElementById("res-room-tag");
    if (st.rm) {
      roomTag.innerText = `Phòng thi: ${st.rm}`;
      roomTag.style.display = "inline-block";
    } else {
      roomTag.style.display = "none";
    }

    document.getElementById("result-card").style.display = "block";
  }

  function enqueueSync(sbd, row, mode, room) {
    syncQueue.push({ sbd, row, mode, room, retries: 0 });
    updateSyncBadge();
    processSyncQueue();
  }

  function updateSyncBadge() {
    const badge = document.getElementById("sync-status");
    if (syncQueue.length > 0) {
      badge.innerText = `Đang lưu (${syncQueue.length})...`;
      badge.className = "sync-badge sync-pending";
    } else if (isDataLoaded) {
      badge.innerText = `Đã đồng bộ ✓`;
      badge.className = "sync-badge sync-ready";
    }
  }

  async function processSyncQueue() {
    if (isSyncing || syncQueue.length === 0) return;
    isSyncing = true;

    const item = syncQueue[0];
    try {
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        redirect: "follow",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          sbd: item.sbd,
          row: item.row,
          mode: item.mode,
          room: item.room
        })
      });
      const data = await res.json();

      if (data.status === "busy") {
        isSyncing = false;
        setTimeout(processSyncQueue, 400);
        return;
      }

      syncQueue.shift();
    } catch (e) {
      item.retries++;
      if (item.retries > 5) {
        syncQueue.shift();
        const badge = document.getElementById("sync-status");
        badge.innerText = "Lỗi lưu Sheet!";
        badge.className = "sync-badge sync-error";
      } else {
        await new Promise(r => setTimeout(r, 800));
      }
    }

    isSyncing = false;
    updateSyncBadge();
    if (syncQueue.length > 0) processSyncQueue();
  }

  function manualCheckin() {
    const sbd = document.getElementById("sbd-input").value.trim();
    if (!sbd) return;
    processCheckin(sbd);
  }

  document.getElementById("sbd-input").addEventListener("keypress", function(e) {
    if (e.key === "Enter") manualCheckin();
  });

  function onScanSuccess(decodedText) {
    const now = Date.now();
    if (decodedText === lastScannedCode && (now - lastScanTime) < 2500) return;
    lastScannedCode = decodedText;
    lastScanTime = now;
    processCheckin(decodedText);
  }

  window.addEventListener("DOMContentLoaded", () => {
    // Khôi phục chế độ và tên phòng đã chọn trước đó trên điện thoại giám thị
    const savedRoom = localStorage.getItem("ELMO_ROOM_NAME");
    if (savedRoom) document.getElementById("room-input").value = savedRoom;

    const savedMode = localStorage.getItem("ELMO_MODE");
    if (savedMode === "room") setMode("room");

    loadStudentDatabase();
    startCamera();
  });
</script>

</body>
</html>
